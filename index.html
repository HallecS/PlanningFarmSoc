const q = $("queue");
// Clic dans Fragments ou Bonus : toute la valeur est sélectionnée pour être remplacée directement
q.addEventListener("focusin", e => {
  if (e.target.matches("input[type=number]")) setTimeout(() => { try { e.target.select(); } catch (err) {} }, 0);
});
[q, $("bans")].forEach(el => {
  el.addEventListener("focusin", () => { editing = true; });
  el.addEventListener("focusout", () => { editing = false; });
});
q.addEventListener("input", e => {
  const f = e.target.dataset.f; if (!f) return;
  const i = Number(e.target.closest(".qrow").dataset.i);
  const c = state.chars[i];
  if (f === "active") {
    c.active = e.target.checked;
    commit();
    document.getElementById("a-" + c.id)?.focus();
    return;
  }
  if (f === "shards" || f === "bonus") {
    const v = Number(e.target.value); if (!Number.isFinite(v)) return;
    c[f] = Math.max(0, Math.round(v));
    if (f === "shards" && promote(c)) {
      // Palier atteint : l'étoile monte, on réaffiche la ligne et on garde la saisie
      commit();
      const el = document.getElementById("f-" + c.id);
      if (el) { el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch (err) {} }
      return;
    }
    const l = document.getElementById("l-" + c.id); if (l) l.innerHTML = leftHtml(c);
  } else c[f] = e.target.value;
  commit(false);
});
q.addEventListener("click", e => {
  const row = e.target.closest(".qrow"); if (!row) return;
  const i = Number(row.dataset.i);
  const sb = e.target.closest("[data-star]");
  if (sb) {
    // Clic sur une étoile : Actuel ne peut pas dépasser Max (Max suit), Max ne descend pas sous Actuel
    const c = state.chars[i], f = sb.dataset.star, v = Number(sb.dataset.v);
    if (f === "star") { c.star = v; if (c.maxStar < v) c.maxStar = v; syncOwnedFromLine(c, true); }
    else c.maxStar = Math.max(v, c.star);
    commit();
    $("queue").querySelector(`.qrow[data-i="${i}"] [data-star="${f}"][data-v="${v}"]`)?.focus();
    return;
  }
  if (e.target.closest("[data-del]")) { state.chars.splice(i, 1); commit(); return; }
  if (e.target.closest("[data-next]")) {
    // Nouvelle ligne pour l'étoile suivante, en fin de file : tu la places où tu veux dans la priorité.
    // Elle ne démarre pas avant la fin de la ligne d'origine (même perso), mais pas forcément juste après.
    const c = state.chars[i];
    const max = Number(c.maxStar) || 1;
    if (max >= 5) return;
    state.chars.push({ id: uid(), active: true, name: c.name, star: max, maxStar: max + 1, shards: 0, bonus: 0, dispo: "", cible: "", after: c.id });
    commit();
    return;
  }
  if (e.target.closest("[data-finish]")) {
    // Terminé : la ligne passe dans l'historique à la date du jour (réelle ou simulée)
    const p = schedule(state)[i];
    const today = nowDay();
    toHistory(p, "manuel", p.segs.length ? Math.min(p.end, today) : today);
    commit();
    return;
  }
  const mv = e.target.closest("[data-mv]");
  if (mv) {
    const j = i + Number(mv.dataset.mv);
    if (j < 0 || j >= state.chars.length) return;
    [state.chars[i], state.chars[j]] = [state.chars[j], state.chars[i]];
    commit();
    q.querySelector(`.qrow[data-i="${j}"] [data-mv="${mv.dataset.mv}"]`)?.focus();
  }
});
let dragFrom = null;
q.addEventListener("dragstart", e => {
  const row = e.target.closest?.(".qrow"); if (!row || e.target.matches("input")) return;
  dragFrom = Number(row.dataset.i); row.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", String(dragFrom)); } catch (err) {}
});
q.addEventListener("dragover", e => {
  const row = e.target.closest(".qrow"); if (dragFrom == null || !row) return;
  e.preventDefault();
  q.querySelectorAll(".over").forEach(r => r.classList.remove("over"));
  row.classList.add("over");
});
q.addEventListener("drop", e => {
  const row = e.target.closest(".qrow"); if (dragFrom == null || !row) return;
  e.preventDefault();
  const to = Number(row.dataset.i);
  const [c] = state.chars.splice(dragFrom, 1);
  state.chars.splice(to, 0, c);
  dragFrom = null; commit();
});
q.addEventListener("dragend", () => { dragFrom = null; q.querySelectorAll(".dragging,.over").forEach(r => r.classList.remove("dragging", "over")); });

$("hist").addEventListener("click", e => {
  const row = e.target.closest(".lrow"); if (!row) return;
  const k = state.history.findIndex(h => h.id === row.dataset.id); if (k < 0) return;
  if (e.target.closest("[data-restore]")) {
    // Nouvelle montée vers 5★ à partir d'aujourd'hui ; l'entrée d'historique reste (ses jours farmés aussi)
    const h = state.history[k];
    const star = Math.min(5, Number(h.star) || 1);
    if (restoreOff(h)) return;
    state.chars.push({ ...h.char, id: h.char.id || uid(), active: true, star, maxStar: 5, shards: 0, bonus: 0,
      dispo: toIso(nowDay()), cible: "" });
    commit();
  } else if (e.target.closest("[data-hdel]")) {
    state.history.splice(k, 1);
    commit();
  }
});

const mems = $("mems");
mems.addEventListener("focusin", () => { editing = true; });
mems.addEventListener("focusout", () => { editing = false; });
mems.addEventListener("input", e => {
  if (e.target.dataset.m !== "name") return;
  const m = state.memories.find(x => x.id === e.target.closest(".lrow").dataset.id); if (!m) return;
  m.name = e.target.value;
  scheduleSave();
});
mems.addEventListener("change", e => {
  const f = e.target.dataset.m;
  if ((f !== "start" && f !== "end") || !e.target.value) return;
  const m = state.memories.find(x => x.id === e.target.closest(".lrow").dataset.id); if (!m) return;
  if (f === "start") {
    // Déplacer le début garde la durée
    const r = memRange(m);
    const a = toDay(e.target.value);
    m.start = e.target.value;
    m.end = toIso(a + (r ? r[1] - r[0] : MEM_DAYS - 1));
  } else {
    m.end = toDay(e.target.value) < toDay(m.start) ? m.start : e.target.value;
  }
  commit();
  document.getElementById((f === "start" ? "md-" : "me-") + m.id)?.focus();
});
mems.addEventListener("click", e => {
  const lenBtn = e.target.closest("[data-len]");
  if (lenBtn) {
    const m = state.memories.find(x => x.id === e.target.closest(".lrow").dataset.id); if (!m || !m.start) return;
    m.end = toIso(toDay(m.start) + Number(lenBtn.dataset.len) - 1);
    commit();
    return;
  }
  if (!e.target.closest("[data-mdel]")) return;
  const id = e.target.closest(".lrow").dataset.id;
  state.memories = state.memories.filter(m => m.id !== id);
  commit();
});

const bans = $("bans");
// Glisser une bannière : les dates (créneaux) restent en place, ce sont les persos qui changent de créneau
let banDrag = null;
bans.addEventListener("dragstart", e => {
  const row = e.target.closest?.(".lrow"); if (!row || e.target.matches("input")) return;
  banDrag = row.dataset.id; row.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", banDrag); } catch (err) {}
});
bans.addEventListener("dragover", e => {
  const row = e.target.closest(".lrow"); if (!banDrag || !row || !row.draggable) return;
  e.preventDefault();
  bans.querySelectorAll(".over").forEach(r => r.classList.remove("over"));
  row.classList.add("over");
});
bans.addEventListener("drop", e => {
  const row = e.target.closest(".lrow"); if (!banDrag || !row || !row.draggable) return;
  e.preventDefault();
  const desc = sortedBanners().reverse();              // ordre affiché (plus récente en haut)
  const dates = desc.map(b => b.date);
  const from = desc.findIndex(b => b.id === banDrag), to = desc.findIndex(b => b.id === row.dataset.id);
  banDrag = null;
  if (from < 0 || to < 0 || from === to) return render();
  const [moved] = desc.splice(from, 1);
  desc.splice(to, 0, moved);
  desc.forEach((b, k) => { b.date = dates[k]; });
  commit();
});
bans.addEventListener("dragend", () => { banDrag = null; bans.querySelectorAll(".dragging,.over").forEach(r => r.classList.remove("dragging", "over")); });
// Nom : mise à jour à la frappe ; date : à la validation (la liste se retrie)
bans.addEventListener("input", e => {
  if (e.target.dataset.b !== "name") return;
  const b = state.banners.find(x => x.id === e.target.closest(".lrow").dataset.id); if (!b) return;
  b.name = e.target.value;
  commit(false);
});
bans.addEventListener("change", e => {
  const f = e.target.dataset.b; if (!f) return;
  const b = state.banners.find(x => x.id === e.target.closest(".lrow").dataset.id); if (!b) return;
  b[f] = f === "planned" ? e.target.checked : e.target.value;
  commit();
  if (f === "planned") { document.getElementById("bp-" + b.id)?.focus(); return; }
  document.getElementById((f === "date" ? "bd-" : "bn-") + b.id)?.focus();
});
bans.addEventListener("click", e => {
  // ↑ ↓ : la bannière échange sa date avec sa voisine (les créneaux restent, les persos bougent)
  const mv = e.target.closest("[data-bmv]");
  if (mv) {
    const id = e.target.closest(".lrow").dataset.id;
    const desc = sortedBanners().reverse();
    const i = desc.findIndex(b => b.id === id);
    const j = i + Number(mv.dataset.bmv);
    if (i < 0 || j < 0 || j >= desc.length) return;
    [desc[i].date, desc[j].date] = [desc[j].date, desc[i].date];
    commit();
    bans.querySelector(`.lrow[data-id="${id}"] [data-bmv="${mv.dataset.bmv}"]`)?.focus();
    return;
  }
  if (e.target.closest("[data-addq]")) {
    // Ajoute le perso de la bannière en fin de file : 1★ → 5★, sortie = date de la bannière
    const b = state.banners.find(x => x.id === e.target.closest(".lrow").dataset.id); if (!b || !b.name) return;
    state.chars.push({ id: uid(), active: true, name: b.name, star: 1, maxStar: 5, shards: 0, bonus: 0, dispo: "", cible: "" });
    commit();
    return;
  }
  if (!e.target.closest("[data-bdel]")) return;
  // Suppression : les bannières suivantes avancent d'un créneau (chacune prend la date de la précédente)
  const id = e.target.closest(".lrow").dataset.id;
  const asc = sortedBanners();
  const k = asc.findIndex(b => b.id === id);
  if (k >= 0) {
    const dates = asc.map(b => b.date);
    for (let j = k + 1; j < asc.length; j++) asc[j].date = dates[j - 1];
  }
  state.banners = state.banners.filter(b => b.id !== id);
  commit();
});
</script>
