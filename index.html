<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121722" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Farm SoC">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Planning de farm SoC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barre de réglages → résumé → Gantt 3 couloirs (défilement horizontal) → file de priorité éditable */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #1b2433;
  --muted: #5d6879;
  --line: #d5dbe4;
  --brass: #a8741c;
  --slot1: #2f7d78;
  --slot2: #7a4b8c;
  --slot3: #b0573a;
  --slot4: #3a679c;
  --slot6: #5b7a2b;
  --slot7: #b0466c;
  --slot8: #7d6046;
  --mem: rgba(168, 116, 28, .22);
  --gained: #fdebd3;
  --bonus-bg: #e2f2e7;
  --tier-bg: #f6f2ea;
  --soon: #e08a1e;
  --star-got: #e0ac16;
  --tier-grain: #e8e1d3;
  --tier-plaque: #efe6d4;
  --tier-ped: #d8d3ef;
  --tier-ped-hi: #f4f2fc;
  --tier-ped-side: #b9b2dc;
  --late: #c2372e;
  --ok: #2e7d4f;
  --banner: #6c7a92;
  --banner-hit: #a8741c;
  --font-display: "Spectral SC", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121722; --surface: #1a2130; --ink: #e4e8ef; --muted: #98a3b5; --line: #2c3547;
    --brass: #d9a54a; --slot1: #4fb0a9; --slot2: #a97dbb; --slot3: #d9805f; --slot4: #6f9fd6; --slot6: #8fb35a; --slot7: #e07aa0; --slot8: #c39a76; --mem: rgba(217, 165, 74, .22); --gained: #3d2c16; --bonus-bg: #1c3526; --tier-bg: #1d2233; --soon: #f0a24a; --star-got: #f2c94c; --tier-grain: #252b40; --tier-plaque: #2a3048; --tier-ped: #4a4670; --tier-ped-hi: #6d6898; --tier-ped-side: #34315a;
    --late: #ef6a5f; --ok: #5cbf83; --banner: #7d8aa3; --banner-hit: #d9a54a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121722; --surface: #1a2130; --ink: #e4e8ef; --muted: #98a3b5; --line: #2c3547;
  --brass: #d9a54a; --slot1: #4fb0a9; --slot2: #a97dbb; --slot3: #d9805f; --slot4: #6f9fd6; --slot6: #8fb35a; --slot7: #e07aa0; --slot8: #c39a76; --mem: rgba(217, 165, 74, .22); --gained: #3d2c16; --bonus-bg: #1c3526; --tier-bg: #1d2233; --soon: #f0a24a; --star-got: #f2c94c; --tier-grain: #252b40; --tier-plaque: #2a3048; --tier-ped: #4a4670; --tier-ped-hi: #6d6898; --tier-ped-side: #34315a;
  --late: #ef6a5f; --ok: #5cbf83; --banner: #7d8aa3; --banner-hit: #d9a54a;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1200px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.9rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.2rem; margin: 0; letter-spacing: .03em; }
.sub { color: var(--muted); margin: 0; max-width: 110ch; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 24px; }
.head-text { display: grid; gap: 4px; min-width: 0; flex: 1 1 420px; }
.head-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: none; }
.io { display: inline-flex; gap: 6px; }
.io button { font-size: .82rem; padding: 5px 10px; }
.io-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--brass); border-radius: 8px; background: var(--gained); font-size: .88rem; }
.io-bar.err { border-color: var(--late); }
.io-actions { display: inline-flex; gap: 6px; }
.io-actions[hidden], .io-bar[hidden] { display: none; }
/* Choix de langue : drapeau + nom */
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); flex: none; }
.lang button { border: 0; border-radius: 0; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; font-size: .82rem; color: var(--muted); background: none; }
.lang button + button { border-left: 1px solid var(--line); }
.lang button[aria-pressed="true"] { color: var(--ink); background: var(--bg); font-weight: 600; }
.lang svg { width: 20px; height: 13px; border-radius: 2px; box-shadow: 0 0 0 1px var(--line); flex: none; }
h1 { display: flex; align-items: center; gap: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
label.field { display: grid; gap: 4px; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
input, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
input[type=number] { width: 4.5em; font-family: var(--font-data); }
input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; }
button:hover { border-color: var(--brass); }
button.primary { background: var(--brass); border-color: var(--brass); color: #fff; font-weight: 600; }
/* Point d'état de la sauvegarde : le détail s'affiche au survol */
.status { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; cursor: help; transition: background .2s; }
.status[data-state="ok"] { background: var(--ok); }
.status[data-state="wait"] { background: var(--brass); }
.status[data-state="sim"] { background: transparent; border: 2px solid var(--brass); box-sizing: border-box; }
.status[data-state="err"] { background: var(--late); }
.status-wrap { position: relative; display: inline-flex; align-items: center; padding: 6px; border-radius: 50%; outline: none; }
.status-wrap:focus-visible { outline: 2px solid var(--brass); }
.status-pop { display: none; position: absolute; top: calc(100% + 6px); left: -8px; z-index: 20; min-width: 250px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  box-shadow: 0 6px 20px rgba(0,0,0,.15); font-family: var(--font-body); font-size: .8rem; font-weight: 400;
  letter-spacing: normal; text-transform: none; font-variant: normal; line-height: 1.4; }
.status-wrap:hover .status-pop, .status-wrap:focus .status-pop { display: grid; gap: 6px; }
.status-pop b { font-weight: 600; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.status-pop .leg { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.status-pop .leg .status { cursor: default; }

.summary { display: flex; flex-wrap: wrap; gap: 10px 28px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.summary div { display: grid; }
.summary b { font-family: var(--font-data); font-weight: 500; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.summary span { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.summary .bad b { color: var(--late); }

section { display: grid; gap: 10px; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 10px; font-size: .8rem; }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--bg); }

.gantt-box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; position: relative; padding-bottom: 14px; }
.gantt { position: relative; }
.axis { position: relative; height: 22px; border-bottom: 1px solid var(--line); font-family: var(--font-data); font-size: .7rem; color: var(--muted); }
.axis .m { position: absolute; top: 4px; padding-left: 4px; border-left: 1px solid var(--line); height: 18px; white-space: nowrap; }
.banners { position: relative; height: 54px; border-bottom: 1px solid var(--line); }
.bn { position: absolute; font-size: .68rem; white-space: nowrap; color: var(--banner); padding-left: 3px; border-left: 2px solid var(--banner); line-height: 1.15; }
.bn.hit { color: var(--banner-hit); border-color: var(--banner-hit); font-weight: 600; }
.lane { position: relative; height: 46px; border-bottom: 1px dashed var(--line); }
.lane:last-child { border-bottom: 0; }
.lane-label { position: sticky; left: 0; z-index: 3; display: inline-block; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: var(--surface); padding: 2px 6px; margin: 2px 0 0 2px; border-radius: 4px; }
.bar { position: absolute; top: 14px; height: 26px; border-radius: 5px; color: #fff; font-size: .74rem; padding: 0 6px; display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; box-sizing: border-box; cursor: default; }
.bar.s0 { background: var(--slot1); } .bar.s1 { background: var(--slot2); } .bar.s2 { background: var(--slot3); }
.bar.s3 { background: var(--slot4); } .bar.s4 { background: var(--brass); }
.bar.s5 { background: var(--slot6); } .bar.s6 { background: var(--slot7); } .bar.s7 { background: var(--slot8); }
.idle { position: absolute; top: 14px; height: 26px; box-sizing: border-box; border: 1px dashed var(--muted); border-radius: 5px; color: var(--muted); font-size: .7rem; display: flex; align-items: center; padding: 0 6px; overflow: hidden; white-space: nowrap;
  background: repeating-linear-gradient(135deg, transparent 0 6px, var(--line) 6px 7px); }
.bar.late { outline: 2px solid var(--late); outline-offset: 1px; }
.bar small { opacity: .85; font-family: var(--font-data); }
.vline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dotted var(--banner); opacity: .45; pointer-events: none; }
.vline.hit { border-left: 1px dashed var(--banner-hit); opacity: .8; }
.vline.today { border-left: 2px solid var(--ink); opacity: .6; }
.target { position: absolute; top: 10px; width: 0; height: 34px; border-left: 2px solid var(--late); }

.queue { display: grid; gap: 6px; }
.qhead, .qrow { display: grid; grid-template-columns: 30px 28px 64px minmax(110px,1.2fr) 104px 104px 72px 72px 150px minmax(150px,1fr) 64px; gap: 8px; align-items: center; }
.qrow input[type=number] { width: 100%; box-sizing: border-box; }
.left-wrap { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; }
.left-wrap button { padding: 2px 8px; font-size: .9rem; line-height: 1.1; flex: none; }
.stars-pick { display: inline-flex; gap: 0; }
.stars-pick button { border: 0; background: none; padding: 2px 1px; font-size: 1.15rem; line-height: 1; color: var(--line); cursor: pointer; }
.stars-pick button.on { color: var(--brass); }
.stars-pick button:hover { color: var(--brass); opacity: .75; }
.stars-pick button:disabled { cursor: default; opacity: 1; }
.left { font-family: var(--font-data); font-size: .76rem; font-variant-numeric: tabular-nums; display: grid; gap: 1px; }
.left b { font-weight: 500; }
.left span { color: var(--muted); }
.qhead { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 10px; }
.qrow { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--line); }
.tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 14px; color: var(--muted); margin-bottom: -1px; }
.tab:hover { color: var(--ink); border-color: var(--line); }
.tab[aria-selected=true] { color: var(--ink); border-color: var(--brass); font-weight: 600; }
.tab .count { font-family: var(--font-data); font-size: .75rem; color: var(--muted); margin-left: 4px; }
.acts { display: flex; gap: 4px; justify-content: flex-end; }
.acts button { padding: 2px 7px; font-size: .8rem; line-height: 1.2; }
.list { display: grid; gap: 6px; }
.lhead, .lrow { display: grid; gap: 8px; align-items: center; padding: 0 10px; }
.lhead { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.lrow { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding-block: 8px; }
.hist .lhead, .hist .lrow { grid-template-columns: minmax(110px, 1.3fr) 70px 96px 96px 90px minmax(160px, auto); }
.bans .lhead, .bans .lrow { grid-template-columns: 78px 32px 150px minmax(120px, 1fr) minmax(110px, auto) 40px; }
.bans .lrow.unplanned input[type=text] { color: var(--muted); }
.bn.off { opacity: .45; }
.head-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.simctl { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.simctl button { border: 0; border-radius: 0; padding: 4px 12px; font-family: var(--font-data); font-size: 1rem; line-height: 1; }
.simctl input { border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-radius: 0; font-family: var(--font-data); font-size: .85rem; }
.sim-info { font-size: .78rem; color: var(--brass); font-weight: 600; }
.simulating { opacity: .85; }
button:disabled { opacity: .5; cursor: default; }
.vline.now { border-left: 2px solid var(--brass); opacity: 1; z-index: 3; }
.vline.now span { position: absolute; top: 2px; left: 3px; font-family: var(--font-data); font-size: .65rem; color: var(--brass); background: var(--surface); padding: 0 3px; white-space: nowrap; }
.mems .lhead, .mems .lrow { grid-template-columns: 140px 140px 92px minmax(120px, 1fr) minmax(110px, auto) 40px; }
.seg.dur { justify-self: start; }
.mem { position: absolute; top: 76px; bottom: 0; background: var(--mem); border-left: 1px solid var(--brass); border-right: 1px solid var(--brass); pointer-events: none; z-index: 2; }
.mem span { position: absolute; top: 2px; left: 3px; font-family: var(--font-data); font-size: .65rem; color: var(--brass); font-weight: 500; }
.lane .bar, .lane .idle { z-index: 1; }
.chip.todo { color: var(--late); }
button.chip { background: none; font: inherit; font-size: .7rem; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; cursor: pointer; }
button.chip.todo:hover { background: var(--late); color: var(--surface); }
/* bannière non cochée « Prévu » : bouton d'ajout discret, plus visible au survol */
.chip.add { color: var(--muted); opacity: .75; }
button.chip.add:hover { opacity: 1; color: var(--ink); }
/* mentions en bas de page */
footer.legal { margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--line); font-size: .7rem; line-height: 1.5; color: var(--muted); text-align: center; }
footer.legal p { margin: 0 auto 4px; max-width: 760px; }
/* intro : étapes pour commencer */
.start-t { margin-bottom: 2px; font-weight: 600; }
ol.start { margin: 0; padding-left: 20px; display: grid; gap: 2px; }
.lrow .data { font-family: var(--font-data); font-size: .82rem; font-variant-numeric: tabular-nums; }
.lrow .stars { color: var(--brass); }
.lrow.past { opacity: .6; }
.lrow input[type=text], .lrow input[type=date] { width: 100%; box-sizing: border-box; }
.chip.auto { color: var(--muted); } .chip.manuel { color: var(--brass); } .chip.hit { color: var(--brass); } .chip.now { color: var(--ok); }
.bar.past { background: var(--muted); opacity: .55; }
.bar.farmed { opacity: .5; border-radius: 5px 0 0 5px;background-image: repeating-linear-gradient(135deg, transparent 0 5px, rgba(255,255,255,.18) 5px 7px); }
.help { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 8px; }
.help > div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.help h3 { font-family: var(--font-display); font-weight: 500; font-size: 1rem; letter-spacing: .03em; margin: 0 0 8px; }
.help dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 0; font-size: .82rem; }
.help dt { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--brass); padding-top: 2px; }
/* pastille de la couleur de ligne devant « Ligne orange » / « Ligne verte » */
.help dt.sw::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; border-radius: 3px; border: 1px solid; }
.help dt.sw-gained::before { background: var(--gained); border-color: var(--brass); }
.help dt.sw-bonus::before { background: var(--bonus-bg); border-color: var(--ok); }
.help dd { margin: 0; color: var(--muted); }
.help code { font-family: var(--font-data); color: var(--ink); }
.qrow.dragging, .bans .lrow.dragging { opacity: .4; }

/* Tier list : inspirée des classements en image (plaque de titre, rangées T0…, sprites chibi sur socle) */
.tier-board { display: grid; gap: 0; background: var(--tier-bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 10px; position: relative; }
.tier-board::before { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: repeating-linear-gradient(0deg, transparent 0 22px, var(--tier-grain) 22px 23px); opacity: .5; }
.tier-board > * { position: relative; }
.tier-plaque { justify-self: center; display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; padding: 8px 28px;
  border: 2px solid var(--brass); border-radius: 6px; background: var(--tier-plaque); box-shadow: inset 0 0 0 3px var(--tier-plaque), inset 0 0 0 4px var(--brass);
  font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; letter-spacing: .04em; color: var(--ink); }
.tier-plaque small { font-family: var(--font-data); font-size: .85rem; color: var(--brass); font-weight: 500; }
.tier-tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-bottom: 6px; }
.tier-tools input { flex: 0 1 220px; }
.tier-tools button { font-size: .82rem; padding: 4px 10px; }
.tier-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.tier-row:first-of-type { border-top: 0; }
.tier-row.pool { border-top: 2px solid var(--brass); margin-top: 6px; }
.tier-label { font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; color: var(--ink); text-align: center; padding-top: 18px; font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1; }
.tier-label.small { font-size: .9rem; line-height: 1.2; padding-top: 22px; color: var(--muted); }
.tier-chars { display: flex; flex-wrap: wrap; gap: 4px 2px; min-height: 92px; align-content: flex-start; border-radius: 8px; padding: 2px; }
.tier-chars.over { background: var(--gained); }
/* écran tactile, perso choisi : les rangées deviennent des cibles (appuyer dessus y déplace le perso) */
.tier-board.touch:has(.tchar.picked) .tier-row { outline: 1px dashed var(--brass); outline-offset: -3px; border-radius: 8px; cursor: pointer; }
.tc-hint.tap-hint { display: none; color: var(--brass); font-weight: 600; }
.tier-board.touch .tc-hint.tap-hint { display: block; }
.tier-empty { align-self: center; margin: auto; color: var(--muted); font-size: .8rem; font-style: italic; }
.tchar { position: relative; width: 70px; display: grid; justify-items: center; padding: 2px 0 0; border-radius: 6px; cursor: grab; outline: none; }
.tchar img, .tchar .noimg { position: relative; z-index: 1; height: 62px; width: 62px; object-fit: contain; object-position: bottom; image-rendering: pixelated; }
.tchar .noimg { display: grid; place-items: center; font-family: var(--font-display); font-size: 1.3rem; color: var(--muted); padding-bottom: 10px; box-sizing: border-box; }
/* socle : petit cube clair vu de dessus, comme dans l'image */
.tchar .ped { position: absolute; top: 50px; left: 50%; width: 46px; height: 18px; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(ellipse at 50% 35%, var(--tier-ped-hi), var(--tier-ped) 70%); box-shadow: 0 3px 0 var(--tier-ped-side), 0 4px 6px rgba(0,0,0,.18); }

const toDay = iso => { if (!iso) return null; const [y,m,d] = iso.split("-").map(Number); return Math.round(Date.UTC(y, m-1, d) / DAY); };
const toIso = n => new Date(n * DAY).toISOString().slice(0, 10);

const fmtMonth = d => d.toLocaleDateString(locale(), {month: "short", year: "2-digit", timeZone: "UTC"});

const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

const MEM_DAYS = 7;
// Début et fin (incluse) d'un event ; sans fin renseignée, il dure 7 jours
const memRange = m => { const a = toDay(m.start); if (a == null) return null; const b = toDay(m.end); return [a, b != null && b >= a ? b : a + MEM_DAYS - 1]; };
// Jours où le gain de fragments est doublé (events Memories)
function boostDays(st) {
  const s = new Set();
  (st.memories || []).forEach(m => { const r = memRange(m); if (r) for (let d = r[0]; d <= r[1]; d++) s.add(d); });
  return s;
}

const sortedBanners = () => [...state.banners].filter(b => b.date).sort((a, b) => a.date.localeCompare(b.date));

function need(c) {
  const max = Math.min(5, Math.max(1, Number(c.maxStar) || 1));
  const cur = Math.min(5, Math.max(1, Number(c.star) || 1));
  let total = 0;
  for (let s = cur + 1; s <= max; s++) total += COST[s];
  if (!total) return 0;
  // Le bonus ne sert que sur la dernière étoile visée : il ne peut pas dépasser son coût
  const bonus = Math.min(Number(c.bonus) || 0, COST[max]);
  return Math.max(0, total - (Number(c.shards) || 0) - bonus);
}

/* Simulation jour par jour :
   - un perso ne démarre jamais avant sa sortie (« Dispo dès », sinon sa bannière) ;
   - chaque jour, les slots vont aux persos disponibles les plus prioritaires (ordre de la file) ;
     un perso en cours qui n'en fait plus partie est mis en pause et reprendra plus tard ;
   - un perso qui continue garde son slot ;
   - les jours déjà farmés par les persos de l'Historique restent réservés. */
function schedule(st) {
  const start = toDay(st.startDate) ?? toDay(todayIso());
  const rate = Math.max(0.1, Number(st.rate) || 3);
  const nSlots = Math.min(5, Math.max(1, Math.round(Number(st.slots) || 3)));
  const release = new Map();
  sortedBanners().forEach(b => { const k = norm(b.name); if (!release.has(k)) release.set(k, toDay(b.date)); });
  const boost = boostDays(st);
  const blocked = new Set();
  (st.history || []).forEach(h => (h.segs || []).forEach(g => {
    for (let d = Math.max(toDay(g.start), start); d <= toDay(g.end); d++) blocked.add(g.slot + ":" + d);
  }));

  const plan = st.chars.map((c, prio) => {
    const n = need(c);
    const off = c.active === false;
    return { c, prio, n, left: n, days: n / rate, release: toDay(c.dispo) ?? release.get(norm(c.name)) ?? null,
             target: toDay(c.cible), segs: [], off, done: n <= 0 || off, finished: n <= 0 || off };
  });
  const slots = Array(nSlots).fill(null);
  const idle = [];
  // Une ligne « étoile suivante » (c.after) attend que la ligne précédente du perso soit terminée
  const byId = new Map(plan.map(p => [p.c.id, p]));
  const avail = (p, d) => !p.finished && (p.release == null || p.release <= d)
    && !(p.c.after && byId.has(p.c.after) && !byId.get(p.c.after).finished);
  const running = p => slots.includes(p);
  const place = (p, i, d) => { slots[i] = p; p.segs.push({ slot: i, start: d, end: d }); };

  // Les persos farmés hier reprennent leur slot (pas de changement de slot d'un jour à l'autre)
  const lastSlot = new Map();
  (st.past || []).forEach(g => { if (toDay(g.end) === start - 1) lastSlot.set(g.id, g.slot); });

  for (let d = start; d < start + 2000 && plan.some(p => !p.finished); d++) {
    const blk = slots.map((_, i) => blocked.has(i + ":" + d));
    blk.forEach((b, i) => { if (b) slots[i] = null; });
    // 1. Chaque jour, les slots vont aux persos disponibles les plus prioritaires de la liste
    const free = blk.filter(b => !b).length;
    const wanted = plan.filter(p => avail(p, d)).slice(0, free);
    // 2. Les persos en cours qui ne sont plus parmi eux sont mis en pause
    slots.forEach((q, i) => { if (q && !wanted.includes(q)) slots[i] = null; });
    // 3. Un perso farmé hier reprend son slot ; les autres prennent le premier slot libre
    wanted.forEach(p => {
      if (running(p)) return;
      const last = d === start ? lastSlot.get(p.c.id) : undefined;
      let i = last != null && last < nSlots && !blk[last] && !slots[last] ? last : -1;
      if (i < 0) i = slots.findIndex((q, k) => !q && !blk[k]);
      if (i >= 0) place(p, i, d);
    });
    // 4. Une journée de farm (et repérage des slots vides)
    slots.forEach((p, i) => {
      if (blk[i]) return;
      if (!p) {
        const g = idle[idle.length - 1];
        if (g && g.slot === i && g.end === d - 1) g.end = d; else idle.push({ slot: i, start: d, end: d });
        return;
      }
      const seg = p.segs[p.segs.length - 1];
      if (seg.slot !== i || seg.end < d - 1) p.segs.push({ slot: i, start: d, end: d }); else seg.end = d;
      // Fragments gagnés pendant la session (le dernier jour ne compte que ce qui manquait)
      const s = p.segs[p.segs.length - 1];
      if (s.before == null) { s.before = Math.max(0, p.left); s.gain = 0; }
      const gain = boost.has(d) ? rate * 2 : rate;
      s.gain += Math.min(gain, Math.max(0, p.left));
      p.left -= gain;
      if (p.left <= 1e-9) { p.finished = true; slots[i] = null; }
    });
  }
  plan.forEach(p => {
    if (!p.segs.length) return;
    p.start = p.segs[0].start;
    p.end = p.segs[p.segs.length - 1].end;
    p.slot = p.segs[0].slot;
    p.late = p.target != null && (p.end > p.target || !p.finished);
  });
  plan.idle = idle;
  return plan;
}

function resultText(p) {
  if (p.off) return t("r_off");
  if (p.done) return t("r_max");
  const rel = p.release != null ? t("r_release", { d: fmt(p.release) }) + " · " : "";
  if (!p.segs.length) return rel + t("r_noroom");
  const parts = p.segs.length > 1 ? t("r_sessions", { n: p.segs.length }) : t("r_slot", { n: p.slot + 1 });
  return `${rel}${fmt(p.start)} → ${fmt(p.end)} · ${parts} · ${t("r_frag", { n: Math.round(p.n) })}${p.late ? " · " + t("r_late") : ""}`;
}

/* ---------- historique ---------- */
// Déplace un perso de la file vers l'historique. Ses jours farmés (jusqu'à `until`) restent réservés.
function toHistory(p, mode, until) {
  // Jours déjà farmés (gains appliqués) + jours prévus jusqu'à `until`
  const done = (state.past || []).filter(g => g.id === p.c.id).map(g => ({ slot: g.slot, start: g.start, end: g.end }));
  state.past = (state.past || []).filter(g => g.id !== p.c.id);
  const segs = done.concat(p.segs.filter(g => g.start <= until).map(g => ({ slot: g.slot, start: toIso(g.start), end: toIso(Math.min(g.end, until)) })));
  const end = segs.length ? segs[segs.length - 1].end : toIso(until);
  state.history.push({ id: uid(), char: { ...p.c }, name: p.c.name, star: p.c.maxStar,
    start: segs.length ? segs[0].start : null, end, segs, mode });
  state.chars = state.chars.filter(c => c !== p.c);
}

/* Gain quotidien : chaque jour, chaque slot rapporte ses fragments (×2 pendant un event Memories)
   au perso qu'il farme. On les ajoute à ses fragments (l'étoile monte au palier) et on garde la
   trace des jours farmés. Les fragments tombent le matin : le jour même est compté.
   state.startDate = premier jour pas encore compté. */
function applyProgress(today = toDay(todayIso())) {
  const start = toDay(state.startDate);
  if (start == null || start > today) return false;
  const plan = schedule(state);
  const last = today;                                  // dernier jour compté
  const boost = boostDays(state);
  const rate = Math.max(0.1, Number(state.rate) || 3);
  state.past = (state.past || []).filter(g => toDay(g.end) >= today - 120);   // on garde ~4 mois
  plan.forEach(p => {
    if (p.done) return;
    let got = 0;
    p.segs.forEach(g => {
      const e = Math.min(g.end, last);
      if (e < g.start) return;
      for (let d = g.start; d <= e; d++) got += boost.has(d) ? rate * 2 : rate;
      // Prolonge la barre farmée précédente si elle se termine la veille (même perso, même slot)
      const prev = state.past.find(x => x.id === p.c.id && x.slot === g.slot && toDay(x.end) === g.start - 1);
      if (prev) prev.end = toIso(e);
      else state.past.push({ id: p.c.id, name: p.c.name, slot: g.slot, start: toIso(g.start), end: toIso(e) });
    });
    if (!got) return;
    p.c.shards = (Number(p.c.shards) || 0) + Math.round(Math.min(got, p.n));
    // Étoile gagnée (même sur une ligne enchaînée ou bonus) : elle est atteinte, la fiche de la tier list suit
    if (promote(p.c)) { p.c.reached = p.c.star; syncOwnedFromLine(p.c, false, true); }
  });
  state.startDate = toIso(last + 1);
  return true;
}

// Persos dont la fin prévue est passée (ou déjà au max) : passage automatique dans l'historique.
function autoArchive(today = toDay(todayIso())) {
  const plan = schedule(state);
  const finished = plan.filter(p => !p.off && ((p.n <= 0) || (p.finished && p.segs.length && p.end < today)));
  finished.forEach(p => toHistory(p, "auto", p.segs.length ? p.end : today));
  return finished.length;
}

const $ = id => document.getElementById(id);
const N_COLORS = 8;
const hashColor = name => [...norm(name)].reduce((a, ch) => a + ch.charCodeAt(0), 0) % N_COLORS;
let colorMap = new Map();
const colorOf = name => colorMap.get(norm(name)) ?? hashColor(name);

/* Couleurs du Gantt : un perso garde la même couleur partout, et deux barres qui se suivent dans
   un slot n'ont jamais la même couleur (coloration de graphe : persos voisins = couleurs différentes). */
function assignColors(plan) {
  const lanes = new Map();
  const add = (slot, start, name) => { if (!lanes.has(slot)) lanes.set(slot, []); lanes.get(slot).push({ start, k: norm(name) }); };
  (state.past || []).forEach(g => add(g.slot, toDay(g.start), g.name || g.id));
  plan.forEach(p => { if (!p.done) p.segs.forEach(g => add(g.slot, g.start, p.c.name || p.c.id)); });
  const nb = new Map(), first = new Map();
  const link = (a, b) => { if (a === b) return; (nb.get(a) || nb.set(a, new Set()).get(a)).add(b); (nb.get(b) || nb.set(b, new Set()).get(b)).add(a); };
  lanes.forEach(items => {
    items.sort((a, b) => a.start - b.start);
    items.forEach((it, i) => {
      if (!first.has(it.k) || it.start < first.get(it.k)) first.set(it.k, it.start);
      if (i > 0) link(items[i - 1].k, it.k);
    });
  });
  colorMap = new Map();
  [...first.keys()].sort((a, b) => first.get(a) - first.get(b)).forEach(k => {
    const used = new Set([...(nb.get(k) || [])].map(n => colorMap.get(n)).filter(c => c != null));
    let c = hashColor(k);
    if (used.has(c)) c = [...Array(N_COLORS).keys()].find(i => !used.has(i)) ?? c;
    colorMap.set(k, c);
  });
}

function renderGantt(plan) {
  assignColors(plan);
  const start = toDay(state.startDate);
  const active = plan.filter(p => !p.done && p.segs.length);
  const nSlots = Math.min(5, Math.max(1, Math.round(Number(state.slots) || 3)));
  const lastEnd = active.length ? Math.max(...active.map(p => p.end)) : start + 60;
  // Le Gantt commence au plus ancien jour farmé connu (jours farmés + historique, 6 mois max)
  const oldest = [...(state.past || []), ...state.history.flatMap(h => h.segs || [])].map(g => toDay(g.start)).filter(n => n != null);
  const from = Math.max(start - 183, Math.min(start - 21, ...oldest) - 7);
  const to = Math.max(lastEnd, ...active.map(p => p.target ?? 0)) + 21;
  const W = (to - from) * px;
  const x = d => (d - from) * px;
  const names = new Set(state.chars.filter(c => c.active !== false).map(c => norm(c.name)));
  const D = t("d");

  const d0 = new Date(from * DAY);
  let months = `<div class="m" style="left:0;border-left:0">${fmtMonth(d0)}</div>`;
  let m = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1));
  while (m.getTime() / DAY < to) {
    months += `<div class="m" style="left:${x(m.getTime() / DAY)}px">${fmtMonth(m)}</div>`;
    m = new Date(Date.UTC(m.getUTCFullYear(), m.getUTCMonth() + 1, 1));
  }

  let bns = "", vlines = "";
  sortedBanners().forEach((b, i) => {
    const n = toDay(b.date);
    if (n < from || n > to) return;
    const hit = b.planned || names.has(norm(b.name));
    const top = (i % 3) * 16 + 4;
    bns += `<div class="bn ${hit ? "hit" : "off"}" style="left:${x(n)}px;top:${top}px" title="${esc(b.name)} · ${fmt(n)}">${esc(b.name)}</div>`;
    vlines += `<div class="vline ${hit ? "hit" : ""}" style="left:${x(n)}px"></div>`;
  });
  const now = nowDay();
  if (now >= from && now <= to) vlines += `<div class="vline now" style="left:${x(now)}px" title="${t("g_today")}${simDay != null ? " (" + t("g_simulated") + ")" : ""} : ${fmt(now)}"><span>${simDay != null ? t("g_simulated") : t("g_now")} ${fmt(now)}</span></div>`;
  (state.memories || []).forEach(mm => {
    const r = memRange(mm); if (!r || r[1] < from || r[0] > to) return;
    vlines += `<div class="mem" style="left:${x(r[0])}px;width:${(r[1] - r[0] + 1) * px}px" title="${esc(mm.name || t("g_mem_default"))} : ${fmt(r[0])} → ${fmt(r[1])}, ${t("g_shards_x2")}"><span>×2</span></div>`;
  });

  let lanes = "";
  for (let s = 0; s < nSlots; s++) {
    let bars = "";
    state.history.forEach(h => (h.segs || []).forEach(g => {
      if (g.slot !== s) return;
      const a = Math.max(toDay(g.start), from), b = toDay(g.end);
      if (b < a) return;
      bars += `<div class="bar past" style="left:${x(a)}px;width:${(b - a + 1) * px}px" title="${esc(t("g_done", { name: h.name, a: fmt(toDay(g.start)), b: fmt(b) }))}">${esc(h.name)} <small>✓</small></div>`;
    }));
    (state.past || []).forEach(g => {
      if (g.slot !== s) return;
      const a = Math.max(toDay(g.start), from), b = toDay(g.end);
      if (b < a) return;
      bars += `<div class="bar s${colorOf(g.name || g.id)} farmed" style="left:${x(a)}px;width:${(b - a + 1) * px}px" title="${esc(t("g_farmed", { name: g.name, a: fmt(toDay(g.start)), b: fmt(b) }))}">${esc(g.name)}</div>`;
    });
    plan.idle.filter(g => g.slot === s).forEach(g => {
      const len = g.end - g.start + 1;
      bars += `<div class="idle" style="left:${x(g.start)}px;width:${len * px}px" title="${esc(t("g_idle", { s: s + 1, a: fmt(g.start), b: fmt(g.end), n: len }))}">${len * px > 60 ? esc(t("g_free", { n: len })) : ""}</div>`;
    });
    active.forEach(p => p.segs.forEach((g, k) => {
      if (g.slot !== s) return;
      const len = g.end - g.start + 1;
      const sess = p.segs.length > 1 ? t("g_session", { k: k + 1, n: p.segs.length }) : "";
      const before = Math.round(g.before ?? p.n), gain = Math.round(g.gain || 0);
      const tip = t("g_tip", { name: p.c.name, sess, s: p.c.star, m: p.c.maxStar, a: fmt(g.start), b: fmt(g.end), len,
        g: gain, before, after: Math.max(0, before - gain), n: Math.round(p.n), end: fmt(p.end) });
      bars += `<div class="bar s${colorOf(p.c.name || p.c.id)}${p.late ? " late" : ""}" style="left:${x(g.start)}px;width:${len * px}px" title="${esc(tip)}">${esc(p.c.name || t("unnamed"))} <small>${p.segs.length > 1 ? (k + 1) + "/" + p.segs.length + " · " : p.c.star + "→" + p.c.maxStar + "★ · "}${len} ${D}</small></div>`;
    }));
    lanes += `<div class="lane"><span class="lane-label">${t("g_slot", { n: s + 1 })}</span>${bars}</div>`;
  }

  $("gantt").style.width = W + "px";
  $("gantt").innerHTML = `<div class="axis">${months}</div><div class="banners">${bns}</div>${lanes}${vlines}`;

  // le reste du temps on garde le défilement de l'utilisateur (il peut remonter dans le passé).
  const key = now + ":" + px + ":" + from;
  if (ganttKey !== key) { ganttKey = key; $("gantt").parentElement.scrollLeft = Math.max(0, x(now) - 72); }   // aujourd'hui juste après les noms de slots
}

// 5 étoiles cliquables (Actuel ou Max)
function starPick(c, f) {
  const v = Number(c[f]) || 1;
  const label = t(f === "star" ? "sp_cur" : "sp_max", { name: c.name });
  return `<span class="stars-pick" role="group" aria-label="${esc(label)}">${[1, 2, 3, 4, 5].map(k =>

}

// Fragments restants : pour l'étoile suivante, et pour toute la ligne (jusqu'à l'étoile visée)
function leftHtml(c) {
  const cur = Number(c.star) || 1, max = Number(c.maxStar) || 1;
  if (cur >= max) return `<b>${t("left_done")}</b>`;
  const next = cur + 1;
  const bonusHere = next === max ? Math.min(Number(c.bonus) || 0, COST[max]) : 0;
  const forStar = Math.max(0, COST[next] - (Number(c.shards) || 0) - bonusHere);
  return `<b>${forStar} → ${next}★</b><span>${Math.round(need(c))} → ${max}★</span>`;
}

// Fragments possédés ≥ palier : on passe l'étoile et le surplus est reporté
function promote(c) {
  let up = false;
  while (c.star < 5 && c.shards >= COST[c.star + 1]) { c.shards -= COST[c.star + 1]; c.star++; up = true; }
  if (c.maxStar < c.star) c.maxStar = c.star;
  return up;
}

    const star = Number(line.star) || 0, max = Number(line.maxStar) || 0;

  } catch (e) { return false; }
}

// Persos légendaires et sprites chibi (fichier legendaires.js) ; les sprites sont convertis une fois en URL blob
const LEG = window.SOC_LEGENDARIES || { chars: [], sprite: {} };
const SPRITE = {};
LEG.chars.forEach(c => {
  const d = LEG.sprite[c.icon]; if (!d) return;
  try {
    const bin = atob(d.slice(d.indexOf(",") + 1)), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const mime = (d.match(/^data:([^;]+);/) || [])[1] || "image/png";   // PNG (Team Builder) ou WebP (Soshage)
    SPRITE[c.id] = URL.createObjectURL(new Blob([arr], { type: mime }));
  } catch (e) { SPRITE[c.id] = d; }
});
delete window.SOC_LEGENDARIES;
const LEG_BY_ID = new Map(LEG.chars.map(c => [String(c.id), c]));
// Clé de nom tolérante : accents et « ? » ignorés, « SP » placé à la fin (« SP Agata » = « Agata SP »)
const NAME_ALIAS = { lucamar: "lukamar", porewit: "perlevit" };
function nameKey(s) {
  const words = String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[?]/g, "").split(/\s+/).filter(Boolean);
  const sp = words.includes("sp");
  let base = words.filter(w => w !== "sp").join(" ");
  base = NAME_ALIAS[base] || base;
  return base + (sp ? " sp" : "");
}
const LEG_BY_NAME = new Map(LEG.chars.map(c => [nameKey(c.name), c]));
// Tier d'un perso du planning (par son nom), ou null
function tierOfName(name) {
  const c = LEG_BY_NAME.get(nameKey(name)); if (!c) return null;
  return state.tiers.find(r => r.ids.includes(String(c.id))) || null;
}
const tierChip = name => { const r = tierOfName(name); return r ? `<span class="tier-chip" title="${esc(t("tier_chip", { t: r.name }))}">${esc(r.name)}</span>` : ""; };

/* Persos pas encore sortis : étiquette orange avec un rond blanc si leur bannière fait partie des
   3 prochaines, étiquette rouge avec une croix blanche si elle est plus loin (ou pas encore annoncée).
   Un perso dont la bannière est passée (ou sans bannière, déjà dans le jeu) n'a pas d'étiquette. */
const SOON_BANNERS = 3;
function soonMark(c) {
  const today = toIso(nowDay());
  const key = nameKey(c.name);
  const mine = sortedBanners().filter(b => nameKey(b.name) === key);
  if (mine.some(b => b.date < today)) return "";                // déjà sorti
  const upcoming = sortedBanners().filter(b => b.date >= today);
  const k = upcoming.findIndex(b => nameKey(b.name) === key);
  if (k < 0 && !c.server) return "";                             // pas de bannière connue : considéré comme sorti
  const soon = k >= 0 && k < SOON_BANNERS;
  const title = k < 0 ? t("soon_none", { s: c.server })
    : t(soon ? "soon_ok" : "soon_far", { n: k + 1, d: fmt(toDay(upcoming[k].date)) });
  return `<span class="soon ${soon ? "ok" : "far"}" title="${esc(title)}" aria-label="${esc(title)}">${soon ? "●" : "✕"}</span>`;
}

/* Fiche simplifiée d'un perso (au clic dans la tier list) : sprite, nom, possédé, classe + tags, étoiles */
const TAG_KEY = { "The Union": "Union" };
// « Sword of Convallaria » → « SwordOfConvallaria » (clé des icônes du Team Builder)
const tagIcon = tg => (LEG.tag || {})[TAG_KEY[tg] || String(tg).split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join("")];
const typeIcon = ty => (LEG.type || {})[ty];
/* Icônes de tags et de rôles : certaines ont une marge transparente et paraissent plus petites.
   Au chargement, on les recadre sur leur dessin (carré centré) pour qu'elles remplissent toutes leur case. */
function trimIcon(src) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      try {
        const W = im.naturalWidth, H = im.naturalHeight, cv = document.createElement("canvas");
        cv.width = W; cv.height = H;
        const g = cv.getContext("2d"); g.drawImage(im, 0, 0);
        const px = g.getImageData(0, 0, W, H).data;
        let x0 = W, y0 = H, x1 = -1, y1 = -1;
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (px[(y * W + x) * 4 + 3] > 12) {
          if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
        if (x1 < 0) return res(src);
        const side = Math.max(x1 - x0 + 1, y1 - y0 + 1), out = document.createElement("canvas");
        out.width = out.height = side;
        out.getContext("2d").drawImage(cv, x0, y0, x1 - x0 + 1, y1 - y0 + 1,
          Math.round((side - (x1 - x0 + 1)) / 2), Math.round((side - (y1 - y0 + 1)) / 2), x1 - x0 + 1, y1 - y0 + 1);
        res(out.toDataURL("image/png"));
      } catch (e) { res(src); }
    };
    im.onerror = () => res(src);
    im.src = src;
  });
}
(async () => {
  for (const map of [LEG.tag || {}, LEG.type || {}]) for (const k of Object.keys(map)) map[k] = await trimIcon(map[k]);
  if (tierPick) renderTier();
})();
const ownOf = cid => ({ own: false, stars: 0, min: 0, bonus: 0, ...((state.owned || {})[cid] || {}) });
let tierBrush = "stars";   // pinceau des étoiles : stars (atteint), min (minimum), bonus

// Lignes de la file qui concernent ce perso (même nom, « SP » et accents ignorés)
const planLinesFor = c => state.chars.filter(x => nameKey(x.name) === nameKey(c.name));
// Étoiles atteintes : la fiche, ou mieux si le planning / l'historique en sait plus
function reachedStars(c) {
  const k = nameKey(c.name);
  // Une fois réglées dans la fiche, les étoiles atteintes font foi (on peut les baisser, jusqu'à 0)
  const mine = ownOf(String(c.id));
  if (mine.set) return mine.stars;
  // Seules les lignes « de départ » comptent : une ligne enchaînée (étoile suivante, bonus) n'est pas encore atteinte
  // (sauf les étoiles qu'elle a déjà gagnées au fil des jours : `reached`)
  const fromPlan = state.chars.filter(x => nameKey(x.name) === k).map(x => (!x.after && !x.bonusOf ? Number(x.star) || 0 : Number(x.reached) || 0));
  const fromHist = state.history.filter(h => nameKey(h.name) === k).map(h => Number(h.star) || 0);
  return Math.max(ownOf(String(c.id)).stars, ...fromPlan, ...fromHist, 0);
}
/* Une ligne principale de la file a changé d'étoile (gain quotidien ou réglage dans l'onglet Planning) :
   si la fiche du perso a ses étoiles réglées, elle suit (exact = valeur imposée, sinon seulement à la hausse) */
// gained = étoile réellement gagnée par le farm : vaut aussi pour une ligne enchaînée ou bonus
function syncOwnedFromLine(line, exact, gained = false) {
  if (!line || (!gained && (line.after || line.bonusOf))) return;
  const lc = LEG_BY_NAME.get(nameKey(line.name)); if (!lc) return;
  const o = (state.owned || {})[String(lc.id)]; if (!o || !o.set) return;
  const s = Number(line.star) || 0;
  o.stars = exact ? s : Math.max(o.stars || 0, s);
}

// Couleur de chaque étoile : jaune = atteinte, rouge = minimum à atteindre, vert = bonus, gris sinon
function starClass(k, got, o) {
  if (k <= got) return "got";
  if (k <= o.min) return "min";
  if (k <= o.bonus) return "bonus";
  return "";
}

/* Lien avec le planning :
   - le minimum devient l'objectif (Max ★) de la ligne du perso dans la file (créée en fin de file si absente) ;
   - le bonus crée une ligne « étoile suivante » en fin de file, après la ligne du minimum :
     elle ne passe que s'il reste de la place dans le planning. */
// create = true quand on coche « Planifier » ; sinon on ne touche à la file que si le perso y est déjà
function syncPlanFor(c, create = false) {
  const o = ownOf(String(c.id)), got = o.own ? reachedStars(c) : 0;
  const lines = planLinesFor(c);
  if (!create && !lines.length) return;           // perso non planifié : les étoiles restent dans la fiche
  let main = lines.find(x => !x.bonusOf) || null;
  // Nom repris de la bannière si elle existe, pour que la date de sortie soit trouvée
  const ban = state.banners.find(b => nameKey(b.name) === nameKey(c.name));
  const planName = main ? main.name : (ban ? ban.name : c.name);
  // Objectif : le minimum s'il est au-dessus des étoiles atteintes, sinon 5★ par défaut
  const target = o.min > got ? o.min : 5;
  if (!main && (create || o.min > got) && got < 5) {
    main = { id: uid(), active: true, name: planName, star: Math.max(1, got), maxStar: Math.max(Math.max(1, got), target), shards: 0, bonus: 0, dispo: "", cible: "" };
    state.chars.push(main);
  } else if (main && o.min > got) main.maxStar = Math.max(Number(main.star) || 1, o.min);
  // Le bonus part de ce que la file vise déjà (minimum, ligne principale ou étoiles atteintes)
  const from = Math.max(o.min, got, ...lines.filter(x => !x.bonusOf).map(x => Number(x.maxStar) || 0));
  let extra = lines.find(x => x.bonusOf) || null;
  if (o.bonus > from) {
    if (!extra) {
      extra = { id: uid(), active: true, name: planName, star: from, maxStar: o.bonus, shards: 0, bonus: 0, dispo: "", cible: "", bonusOf: String(c.id) };
      state.chars.push(extra);
    }
    extra.star = from; extra.maxStar = o.bonus;
    if (main) extra.after = main.id; else delete extra.after;
  } else if (extra) {
    state.chars = state.chars.filter(x => x !== extra);
  }
}

// État des étoiles d'un perso : atteintes (got) et objectifs (min, bonus), comme affiché partout
function starState(c) {
  const own = ownOf(String(c.id));
  // Perso non possédé : aucune étoile en jaune (même la 1re que la file suppose par défaut)
  const got = own.own ? reachedStars(c) : 0;
  // Tant que le minimum n'a jamais été réglé dans la fiche, l'objectif prévu dans la file en tient lieu
  if (own.minSet) return { got, o: own };
  const planned = Math.max(0, ...planLinesFor(c).filter(x => !x.bonusOf).map(x => Number(x.maxStar) || 0));
  return { got, o: { ...own, min: Math.max(own.min, planned > got ? planned : 0) } };
}
// Petite ligne de 5 étoiles colorées sous le perso dans le classement

}

/* Trait du perso (données Soshage) : lignes de base + lignes du niveau d'étoile choisi.
   Le niveau affiché est par défaut celui des étoiles atteintes ; les boutons 1★…5★ permettent de voir les autres.
   Une ligne nouvelle ou modifiée par rapport à l'étoile précédente est marquée ▲. */
let traitStar = null;
/* Mots-clés entre crochets (bonus, malus, états, skills liés) : définition au survol ou au clic (fichier keywords.js,
   chargé à l'ouverture d'une fiche). ▲ bonus, ▼ malus, ⊘ contrôle : petites icônes du jeu dans le texte. */
let KW = { kw: {}, by: {}, icons: {}, spr: {} }, kwLoad = "idle", kwCid = null;
function loadKeywords() {
  if (kwLoad !== "idle") return;
  kwLoad = "loading";
  const s = document.createElement("script");
  s.src = "keywords.js";
  s.onload = () => { KW = window.SOC_KEYWORDS || KW; delete window.SOC_KEYWORDS; kwLoad = "ok"; if (tierPick) renderTier(); };
  s.onerror = () => { kwLoad = "error"; };
  document.head.appendChild(s);
}
// Nom exact, sinon sans tenir compte des majuscules ni du pluriel (« Buffs » → « Buff »)
let kwLower = null;
function kwDef(name) {
  const hit = (KW.by[kwCid] || {})[name] || KW.kw[name];
  if (hit || kwLoad !== "ok") return hit || null;
  if (!kwLower) { kwLower = new Map(); Object.keys(KW.kw).forEach(k => kwLower.set(k.toLowerCase(), KW.kw[k])); }
  const l = name.toLowerCase();
  return kwLower.get(l) || kwLower.get(l.replace(/s$/, "")) || null;
}
const sprFmt = h => h.replace(/[▲▼⊘]/g, ch => KW.spr[ch] ? `<img class="spr" src="${KW.spr[ch]}" alt="${ch}">` : `<i class="spr-t">${ch}</i>`);
const numFmt = h => h.replace(/(\d+(?:\.\d+)?%?)/g, '<b class="num">$1</b>');
// interactive = false dans la bulle elle-même (pas de bulle dans la bulle)
function traitFmt(s, interactive = true) {
  return String(s).split(/(\[[^\]]+\])/).map(part => {
    const m = part.match(/^\[([^\]]+)\]$/);
    if (!m) return sprFmt(numFmt(esc(part)));
    const name = m[1].trim(), has = interactive && kwDef(name);
    return `<span class="kw${has ? " has" : ""}"${has ? ` data-kw="${esc(name)}" tabindex="0"` : ""}>${sprFmt(esc(name))}</span>`;
  }).join("");
}
/* Bulles des mots-clés, en chaîne : survoler un mot-clé de la fiche ouvre sa bulle ; on peut descendre dedans
   sans qu'elle se ferme, et survoler un mot-clé de la bulle ouvre la suivante juste en dessous (ou au-dessus / à côté
   s'il n'y a pas la place). Tout se ferme peu après que la souris a quitté le mot-clé et ses bulles.
   Un clic (ou un appui sur écran tactile) les garde ouvertes jusqu'au prochain clic ailleurs. */
let kwPops = [], kwSrc = null, kwSticky = false, kwHideT = null;
function kwPopHtml(name) {
  const d = kwDef(name); if (!d) return "";
  const ico = d.i && KW.icons[d.i];
  return `<div class="kt-head">${ico ? `<img src="${ico}" alt="">` : ""}<b>${sprFmt(esc(name))}</b>${d.k === "skill" ? `<small>${esc(t("kw_skill"))}</small>` : ""}</div>
    ${(d.d || []).map(l => `<p>${traitFmt(l)}</p>`).join("")}`;
}
function closeKwFrom(level) {
  kwPops.splice(level).forEach(p => p.el.remove());
  const last = kwPops[kwPops.length - 1];
  if (last) last.el.querySelectorAll(".kw.open").forEach(x => x.classList.remove("open"));
}
// Ouvre la bulle du niveau `level` (0 = depuis la fiche) pour le mot-clé `anchor`
function openKw(level, anchor) {
  const name = anchor.dataset.kw;
  if (kwPops[level] && kwPops[level].name === name) { closeKwFrom(level + 1); return; }
  closeKwFrom(level);
  if (level > 0) anchor.classList.add("open");
  const el = document.createElement("div");
  el.className = "kwpop" + (kwSticky ? " sticky" : ""); el.setAttribute("role", "tooltip"); el.dataset.level = level;
  el.style.zIndex = 1000 + level;
  el.innerHTML = kwPopHtml(name);
  document.body.appendChild(el);
  kwPops.push({ el, name });
  const w = el.offsetWidth, h = el.offsetHeight, gap = 6;
  // Niveau 0 : sous le mot-clé. Niveaux suivants : sous la bulle précédente, sinon au-dessus, sinon à côté.
  const ref = level === 0 ? anchor.getBoundingClientRect() : kwPops[level - 1].el.getBoundingClientRect();
  let left = level === 0 ? ref.left : ref.left, top;
  if (ref.bottom + gap + h <= innerHeight - 8) top = ref.bottom + gap;
  else if (ref.top - gap - h >= 8) top = ref.top - gap - h;
  else {
    top = Math.max(8, Math.min(ref.top, innerHeight - h - 8));
    left = ref.right + gap + w <= innerWidth - 8 ? ref.right + gap : ref.left - gap - w;
  }
  el.style.left = Math.max(8, Math.min(left, innerWidth - w - 8)) + "px";

}
function hideKw() {

}
const kwStay = () => clearTimeout(kwHideT);

// Dans les bulles : survol = bulle suivante ; clic/appui = pareil (écran tactile)
document.addEventListener("mouseover", e => {
  const pop = e.target.closest && e.target.closest(".kwpop"); if (!pop) return;
  kwStay();
  const k = e.target.closest(".kw.has"); if (k) openKw(Number(pop.dataset.level) + 1, k);

document.addEventListener("mouseout", e => {

document.addEventListener("click", e => {
  const pop = e.target.closest(".kwpop");
  if (pop) { const k = e.target.closest(".kw.has"); if (k) openKw(Number(pop.dataset.level) + 1, k); return; }
  if (kwPops.length && !e.target.closest(".kw.has")) hideKw();

function traitHtml(c, got, o) {

  // Comme dans le jeu : le trait de base (1★), puis pour chaque étoile seulement ce qu'elle apporte
  // (lignes nouvelles ou modifiées par rapport à l'étoile précédente). Coche = niveau atteint.
  const levels = [2, 3, 4, 5].map(n => {
    const cur = tr.levels[n] || [], prev = tr.levels[n - 1] || [];
    const shown = n === 2 ? tr.base.concat(prev) : prev; // le niveau 1 affiché = trait de base + lignes de 1★
    const diff = cur.filter(l => !shown.includes(l));

    return `<section class="tt-lvl ${cls}">
      <header>${n <= got ? `<span class="ok" aria-label="${esc(t("trait_got"))}">✓</span>` : ""}<span class="st">${"★".repeat(n)}</span><span>${esc(t("trait_lv_n", { n }))}</span></header>
      <ul>${diff.map(li).join("")}</ul></section>`;
  }).join("");

    <section class="tt-lvl base ${starClass(1, got, o)}">

      <ul>${tr.base.concat(tr.levels[1] || []).map(li).join("")}</ul></section>

// Choix aux rangs : le 1er skill choisi est gratuit, le 2e se débloque avec une Castalia

function skillsHtml(c) {

// Place la fiche sous le perso choisi, sans sortir du cadre

    if (tc.dataset.tc === "star") {
      const v = Number(tc.dataset.v);
      /* Règle unique : l'étoile cliquée prend la couleur du pinceau.
         Si elle est déjà la dernière étoile de cette couleur, on en retire une (elle repasse à la couleur d'en dessous).
         Ordre toujours respecté : jaune (atteint) ≤ rouge (minimum) ≤ vert (bonus). */
      const st = c ? starState(c) : { got: o.stars, o };
      // Seuls les niveaux réellement visibles comptent (un minimum caché sous les étoiles jaunes n'existe pas)
      let got = st.got;
      let min = st.o.min > got ? st.o.min : 0;
      let bonus = st.o.bonus > Math.max(got, min) ? st.o.bonus : 0;
      const isLast = (n, lo) => n === v && v > lo;           // v est la dernière étoile de cette couleur
      if (tierBrush === "stars") {
        got = isLast(got, 0) ? v - 1 : v;
      } else if (tierBrush === "min") {
        if (isLast(min, got)) min = v - 1;
        else { min = v; if (got >= v) got = v - 1; }
      } else {
        if (isLast(bonus, Math.max(got, min))) bonus = v - 1;
        else { bonus = v; if (min >= v) min = v - 1; if (got >= v) got = v - 1; }
      }
      const gotChanged = got !== st.got;
      o.stars = got; o.set = true;
      o.min = min > got ? min : 0; o.minSet = true;
      o.bonus = bonus > Math.max(got, min) ? bonus : 0;
      if (got > 0) o.own = true;
      if (c) planLinesFor(c).filter(x => !x.after && !x.bonusOf).forEach(x => {
        // La ligne principale dans la file suit : étoiles atteintes (au moins 1★) et objectif = minimum s'il est au-dessus
        if (gotChanged) x.star = Math.max(1, got);
        if (o.min > got) x.maxStar = Math.max(Number(x.star) || 1, o.min);
        if (Number(x.maxStar) < Number(x.star)) x.maxStar = x.star;
      });
    }
    if (tc.dataset.tc === "sk") {
      // Choix d'un skill de rang : gratuit, puis Castalia ; re-cliquer le retire
      const sc = $("tcard")?.querySelector(".tc-skills")?.scrollTop || 0;
      togglePick(o, String(tc.dataset.r), Number(tc.dataset.i));
      state.owned[cid] = o;
      commit();
      const box = $("tcard")?.querySelector(".tc-skills"); if (box) box.scrollTop = sc;
      $("tcard")?.querySelector(`[data-tc="sk"][data-r="${tc.dataset.r}"][data-i="${tc.dataset.i}"]`)?.focus({ preventScroll: true });
      return;
    }
    if (tc.dataset.tc === "own") { o.own = tc.checked; }
    state.owned[cid] = o;
    if (c && tc.dataset.tc === "plan") {
      // Planifier : ajoute le perso à la file (objectif = minimum, sinon 5★, + ligne bonus) ; décocher le retire de la file
      if (tc.checked) syncPlanFor(c, true);
      else state.chars = state.chars.filter(x => nameKey(x.name) !== nameKey(c.name));
      commit();
      $("tc-plan")?.focus();
      return;
    }
    if (c && tc.dataset.tc === "star") syncPlanFor(c);
    commit();
    $("tcard")?.querySelector(tc.dataset.tc === "star" ? `[data-v="${tc.dataset.v}"]` : "#tc-own")?.focus();
    return;
  }
  if (e.target.closest("#tcard")) return;
  if (e.target.closest("#tier-add")) {
    const n = state.tiers.length;
    state.tiers.push({ id: uid(), name: "T" + n, ids: [] });
    commit(); return;
  }
  if (e.target.closest("#tier-del")) {
    const last = state.tiers[state.tiers.length - 1];
    if (state.tiers.length > 1 && last && !last.ids.length) { state.tiers.pop(); commit(); }
    return;
  }
  const tile = e.target.closest(".tchar");
  const zone = e.target.closest("[data-drop]");
  if (tile) {
    // (sur écran tactile, appuyer sur un autre perso le choisit à la place : pour déplacer, appuyer sur la rangée)
    // Clic sur un perso : ouvre sa fiche (ou la ferme si elle est déjà ouverte)
    tierPick = tile.dataset.cid === tierPick ? null : tile.dataset.cid;
    tierBrush = "stars"; traitStar = null;
    renderTier();
    board.querySelector(`.tchar[data-cid="${tile.dataset.cid}"]`)?.focus();
    return;
  }
  // Écran tactile (pas de glisser-déposer) : perso choisi + appui sur une rangée (nom ou espace libre) = il y est déplacé
  const row = e.target.closest(".tier-row");
  if (tierTouch && tierPick && row) {
    const cid = tierPick;
    moveTier(cid, row.dataset.tier || null);
    board.querySelector(`.tchar[data-cid="${cid}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    return;
  }
  // Clic ailleurs dans le classement : la fiche se ferme (à la souris, les rangées se remplissent par glisser-déposer)
  if (tierPick && zone) { tierPick = null; renderTier(); }
});
// Mots-clés de la fiche : survol ou focus = bulle ; clic = bulle gardée ouverte (re-clic pour fermer)
// (tant que des bulles sont gardées ouvertes, survoler un autre mot-clé de la fiche ne les remplace pas)
const openKwFromCard = k => { if (kwSrc !== k || !kwPops.length) { kwSrc = k; openKw(0, k); } };
board.addEventListener("mouseover", e => { const k = e.target.closest("#tcard .kw.has"); if (!k) return; kwStay(); if (!kwSticky) openKwFromCard(k); });
board.addEventListener("mouseout", e => { const k = e.target.closest("#tcard .kw.has"); if (k && !k.contains(e.relatedTarget) && !inKwZone(e.relatedTarget)) kwLeave(); });
board.addEventListener("focusin", e => { const k = e.target.closest("#tcard .kw.has"); if (k && !kwSticky) openKwFromCard(k); });
board.addEventListener("focusout", e => { if (e.target.closest("#tcard .kw.has") && !kwSticky) kwLeave(); });
board.addEventListener("click", e => {
  const k = e.target.closest("#tcard .kw.has"); if (!k) return;
  e.stopPropagation();
  if (kwSticky && kwSrc === k) { hideKw(); return; }
  hideKw(); kwSticky = true; k.classList.add("pin"); kwSrc = k; openKw(0, k);
}, true);
// Échap ferme ; le défilement de la page ferme aussi (pas celui d'une bulle)
document.addEventListener("keydown", e => { if (e.key === "Escape" && kwPops.length) hideKw(); });
document.addEventListener("scroll", e => { if (kwPops.length && !(e.target.closest && e.target.closest(".kwpop"))) hideKw(); }, true);
board.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".tchar, .sk.pick")) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape" && tierPick) { tierPick = null; renderTier(); }
});
board.addEventListener("input", e => {
  if (e.target.id !== "tier-q") return;
  tierQuery = e.target.value;
  const pos = e.target.selectionStart;
  renderTier();
  const q = $("tier-q"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (err) {} }
});
board.addEventListener("dragstart", e => {
  const tile = e.target.closest?.(".tchar"); if (!tile) return;
  tierDrag = tile.dataset.cid; tile.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", tierDrag); } catch (err) {}
});
board.addEventListener("dragover", e => {
  const zone = e.target.closest("[data-drop]"); if (!tierDrag || !zone) return;
  e.preventDefault();
  board.querySelectorAll(".over").forEach(z => z.classList.remove("over"));
  (e.target.closest(".tchar") || zone).classList.add("over");
});
board.addEventListener("drop", e => {
  const zone = e.target.closest("[data-drop]"); if (!tierDrag || !zone) return;
  e.preventDefault();
  const tile = e.target.closest(".tchar");
  const cid = tierDrag; tierDrag = null;
  if (tile && tile.dataset.cid === cid) { renderTier(); return; }
  moveTier(cid, zone.dataset.drop || null, tile ? tile.dataset.cid : null);
});
board.addEventListener("dragend", () => { tierDrag = null; board.querySelectorAll(".dragging,.over").forEach(z => z.classList.remove("dragging", "over")); });

function renderTabs() {
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  $("panel-plan").hidden = tab !== "plan";
  $("panel-hist").hidden = tab !== "hist";

/* ---------- simulation du temps ---------- */
// simDay = jour simulé (null = vraie date du jour). Pendant une simulation, `state` est un bac à sable :
// une copie des vraies données (gardées dans realState) que l'on peut modifier sans rien enregistrer.
// Avancer (+) garde les modifs du bac à sable ; reculer (−) repart des vraies données.
let simDay = null, realState = null;
const nowDay = () => simDay ?? toDay(todayIso());
const clone = o => JSON.parse(JSON.stringify(o));

function shiftSim(d) {
  const real = toDay(todayIso());
  if (d == null || d === real) {
    if (realState) state = realState;
    realState = null; simDay = null;
    render();
    return;
  }
  if (!realState) { realState = state; state = clone(realState); }
  else if (d < nowDay()) state = clone(realState);
  simDay = d;
  applyProgress(d);
  autoArchive(d);
  render();
}

function render(full = true) { renderView(full); }

function renderSim() {
  const on = simDay != null;
  $("sim-date").value = toIso(nowDay());
  const diff = nowDay() - toDay(todayIso());
  $("sim-info").textContent = on ? t("sim_info", { d: (diff > 0 ? "+" : "") + diff }) : "";
  $("sim-reset").hidden = !on;
  ["panel-plan", "panel-hist", "panel-ban", "panel-mem"].forEach(id => $(id).classList.toggle("simulating", on));
}

function renderView(full = true) {
  const plan = schedule(state);
  renderGantt(plan);
  if (full) { renderQueue(plan); renderHistory(); renderBanners(); renderMemories(); renderTier(); }
  else plan.forEach((p, i) => {
    const row = $("queue").querySelector(`.qrow[data-i="${i}"] .result`);
    if (!row) return;
    row.className = "result" + (p.done ? " done" : p.late ? " late" : "");
    row.textContent = resultText(p);
  });
  renderTabs();
  document.querySelectorAll("#zoom button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.px) === px)));
  renderSim();
}

/* ---------- sauvegarde ---------- */
let db = null, ref = null, lastJson = "", saveTimer = null, saving = Promise.resolve(), editing = false;
// État de la sauvegarde, affiché en point coloré (détail et légende au survol)
const STATUS_STATE = { loading: "wait", synced: "ok", saved: "ok", savedLocal: "ok", modified: "wait", sim: "sim",
  readonly: "err", saveFail: "err", notSaved: "err", offline: "off", empty: "wait", syncLost: "err" };
let statusKey = "loading";
function setStatus(key) {
  statusKey = key;
  const text = t("st_prefix") + t("st_" + key);
  $("status").dataset.state = STATUS_STATE[key] || "wait";
  $("status").setAttribute("aria-label", text);
  $("status-text").textContent = text;
}

function scheduleSave() {
  if (realState) { setStatus("sim"); return; }
  clearTimeout(saveTimer);
  setStatus("modified");
  saveTimer = setTimeout(() => {
    const json = JSON.stringify(state);
    if (json === lastJson) { setStatus("saved"); return; }
    lastJson = json;
    if (ref) {
      saving = saving.then(() => ref.set(JSON.parse(json)))
        .then(() => setStatus("saved"))
        .catch(e => setStatus(e && e.code === "invalid_argument" ? "readonly" : "saveFail"));
    } else {
      try { localStorage.setItem("soc-plan", json); setStatus("savedLocal"); }
      catch (e) { setStatus("notSaved"); }
    }
  }, 700);
}

function commit(fullRender = true) { render(fullRender); scheduleSave(); }

function load(data) {
  if (!data) return false;
  state = {
    startDate: data.startDate || todayIso(),
    rate: Number(data.rate) || 3,
    slots: Number(data.slots) || 3,
    chars: Array.isArray(data.chars) ? data.chars.map(c => ({ ...c })) : [],
    history: Array.isArray(data.history) ? data.history.map(h => ({ ...h, segs: (h.segs || []).map(g => ({ ...g })), char: { ...(h.char || {}) } })) : [],
    banners: Array.isArray(data.banners) ? data.banners.map(b => ({ ...b })) : defaultBanners(),
    memories: Array.isArray(data.memories) ? data.memories.map(m => ({ ...m })) : [],
    owned: data.owned && typeof data.owned === "object" ? JSON.parse(JSON.stringify(data.owned)) : {},
    tiers: Array.isArray(data.tiers) && data.tiers.length ? data.tiers.map(r => ({ id: String(r.id), name: String(r.name), ids: (r.ids || []).map(String) })) : defaultTiers(),
    past: Array.isArray(data.past) ? data.past.map(g => ({ ...g })) : [],
    v: 2
  };
  // Première fois : on coche les bannières des persos déjà dans la file ou l'historique
  const known = new Set(state.chars.map(c => norm(c.name)).concat(state.history.map(h => norm(h.name))));
  state.banners.forEach(b => { if (b.planned === undefined) b.planned = known.has(norm(b.name)); });
  // Anciennes données : la date de début n'était pas encore comptée. Si c'est aujourd'hui, les
  // fragments saisis incluent déjà la récolte du matin : on la considère comme comptée.
  if (data.v !== 2 && state.startDate === todayIso()) state.startDate = toIso(toDay(todayIso()) + 1);
  return data.v !== 2;
}

// Charge des données, applique les gains, range les persos terminés, puis affiche
function loadAndRender(data) {
  const migrated = load(data);
  ganttKey = "";   // données (re)chargées : on recale le Gantt sur aujourd'hui
  const gained = applyProgress();
  const moved = autoArchive();
  render();
  if (migrated || gained || moved) scheduleSave();
}

function setLang(l) {
  if (!I18N[l]) return;
  lang = l;
  try { localStorage.setItem("soc-lang", l); } catch (e) {}
  applyStatic();
  setStatus(statusKey);
  render();
}

applyStatic();
setStatus("loading");
(async () => {
  try { const local = localStorage.getItem("soc-plan"); if (local) loadAndRender(JSON.parse(local)); else render(); } catch (e) { render(); }
  setStatus("offline");
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) return;
  ref = db.doc("plans/main");
  setStatus("synced");
  ref.onSnapshot(snap => {
    if (!snap.exists) { setStatus("empty"); return; }
    if (snap.metadata.hasPendingWrites) return;
    const json = JSON.stringify(snap.data());
    if (json === lastJson || editing || realState) return;
    lastJson = json;
    loadAndRender(snap.data());
    setStatus("synced");
  }, () => setStatus("syncLost"));
})();

/* ---------- copie de secours (export / import) ---------- */
let pendingImport = null, ioTimer = null;
function ioMessage(text, { error = false, confirm = false } = {}) {
  clearTimeout(ioTimer);
  $("io-msg").textContent = text;
  $("io-bar").classList.toggle("err", error);
  $("io-actions").hidden = !confirm;
  $("io-bar").hidden = !text;
  // Les messages simples disparaissent tout seuls ; la question d'import attend une réponse
  if (text && !confirm) ioTimer = setTimeout(() => { $("io-bar").hidden = true; }, 8000);
}

$("io-export").addEventListener("click", async () => {
  // Toujours les vraies données, même pendant une simulation
  const data = { app: "soc-farm-planner", exportedAt: todayIso(), ...(realState || state) };
  const filename = `planning-soc-${todayIso()}.json`, json = JSON.stringify(data, null, 2);
  let dl = null;
  try { dl = await window.claude?.use?.("downloads"); } catch (e) { dl = null; }
  if (!dl) {
    // Page ouverte hors de claude.ai : téléchargement classique du navigateur
    try {
      const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      const a = Object.assign(document.createElement("a"), { href: url, download: filename });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      ioMessage(t("io_saved"));
    } catch (e) { ioMessage(t("io_unavail"), { error: true }); }
    return;
  }
  try {
    await dl.save({ filename, data: json });
    ioMessage(t("io_saved"));
  } catch (e) {
    ioMessage(t(e && e.code === "declined" ? "io_declined" : "io_unavail"), { error: !(e && e.code === "declined") });
  }
});

$("io-import").addEventListener("click", () => { $("io-file").value = ""; $("io-file").click(); });
$("io-file").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  let data = null;
  try { data = JSON.parse(await file.text()); } catch (err) { data = null; }
  if (!data || typeof data !== "object" || !Array.isArray(data.chars)) { pendingImport = null; ioMessage(t("io_bad"), { error: true }); return; }
  pendingImport = { data, file: file.name };
  ioMessage(t("io_confirm", { file: file.name, n: data.chars.length, d: data.exportedAt ? fmt(toDay(data.exportedAt)) : "?" }), { confirm: true });
});
$("io-cancel").addEventListener("click", () => { pendingImport = null; ioMessage(""); });
$("io-ok").addEventListener("click", () => {
  if (!pendingImport) return;
  const { data, file } = pendingImport;
  pendingImport = null;
  if (realState) { state = realState; realState = null; simDay = null; }   // on quitte la simulation
  const { app, exportedAt, ...rest } = data;
  loadAndRender(rest);
  lastJson = "";            // force l'enregistrement des données importées
  scheduleSave();
  ioMessage(t("io_done", { file }));
});

/* ---------- interactions ---------- */
document.querySelectorAll(".lang [data-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
// Page restée ouverte : au changement de jour, on applique les gains et on range les persos finis
setInterval(() => {
  if (realState || editing) return;
  if (toDay(state.startDate) <= toDay(todayIso())) {

}, 10 * 60 * 1000);
$("sim-minus").addEventListener("click", () => shiftSim(nowDay() - 1));
$("sim-plus").addEventListener("click", () => shiftSim(nowDay() + 1));
$("sim-reset").addEventListener("click", () => shiftSim(null));
$("sim-date").addEventListener("change", e => { if (e.target.value) shiftSim(toDay(e.target.value)); });
document.querySelectorAll("#zoom button").forEach(b => b.addEventListener("click", () => {

}));
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {

}));

$("add").addEventListener("click", () => {
  if (tab === "mem") {
    const id = uid();
